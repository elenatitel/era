# Local development: only PostgreSQL. Run the API and web app with npm (see README).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pms_owner
      POSTGRES_PASSWORD: pms_owner
      POSTGRES_DB: pms
      APP_DB_PASSWORD: pms_app
    ports: ['5432:5432']
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pms_owner -d pms']
      interval: 5s
      retries: 10
volumes:
  pgdata-dev:
