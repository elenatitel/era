{{- if .Values.ingress.enabled }}
{{- $full := include "era.fullname" . -}}
{{- $ing := .Values.ingress -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels:
    {{- include "era.labels" . | nindent 4 }}
  annotations:
    # The app limits request bodies to 2 MB; match it at the edge.
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    {{- if $ing.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $ing.tls.clusterIssuer | quote }}
    {{- end }}
    {{- if $ing.basicAuth.enabled }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ required "ingress.basicAuth.secretName is required" $ing.basicAuth.secretName | quote }}
    nginx.ingress.kubernetes.io/auth-realm: "era. staging"
    {{- end }}
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $ing.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.host | quote }}
        {{- if and .Values.mailpit.enabled .Values.mailpit.host }}
        - {{ .Values.mailpit.host | quote }}
        {{- end }}
      secretName: {{ default (printf "%s-tls" $full) $ing.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: {{ $full }}-api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $full }}-web, port: { name: http } }
    {{- if and .Values.mailpit.enabled .Values.mailpit.host }}
    - host: {{ .Values.mailpit.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $full }}-mailpit, port: { name: ui } }
    {{- end }}
{{- end }}
