apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "era.fullname" . }}-config
  labels:
    {{- include "era.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  APP_NAME: {{ .Values.app.name | quote }}
  WEB_ORIGIN: {{ printf "https://%s" .Values.host | quote }}
  TRUST_PROXY: {{ .Values.app.trustProxy | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  BOOKING_HOLD_MINUTES: {{ .Values.app.bookingHoldMinutes | quote }}
  DATABASE_SSL: {{ .Values.database.ssl | quote }}
  {{- if .Values.mailpit.enabled }}
  SMTP_HOST: {{ printf "%s-mailpit" (include "era.fullname" .) | quote }}
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  {{- else if .Values.app.mail.host }}
  SMTP_HOST: {{ .Values.app.mail.host | quote }}
  SMTP_PORT: {{ .Values.app.mail.port | quote }}
  SMTP_SECURE: {{ .Values.app.mail.secure | quote }}
  {{- with .Values.app.mail.user }}
  SMTP_USER: {{ . | quote }}
  {{- end }}
  {{- end }}
  MAIL_FROM: {{ .Values.app.mail.from | quote }}
  {{- with .Values.app.platformAdminEmail }}
  PLATFORM_ADMIN_EMAIL: {{ . | quote }}
  {{- end }}
