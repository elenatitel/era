{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets -}}
{{- $db := .Values.database -}}
{{- $host := include "era.dbHost" . -}}
{{- $appPw := required "database.appPassword is required" $db.appPassword -}}
{{- $ownerPw := required "database.ownerPassword is required" $db.ownerPassword -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "era.secretName" . }}
  labels:
    {{- include "era.labels" . | nindent 4 }}
  annotations:
    # Keep the secret if the release is uninstalled: ENCRYPTION_KEY cannot be recovered.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required (openssl rand -hex 32)" $s.jwtSecret | quote }}
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required (openssl rand -base64 32)" $s.encryptionKey | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%v/%s" (urlquery $db.appUser) (urlquery $appPw) $host $db.port $db.name | quote }}
  DATABASE_MIGRATION_URL: {{ printf "postgres://%s:%s@%s:%v/%s" (urlquery $db.ownerUser) (urlquery $ownerPw) $host $db.port $db.name | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ $ownerPw | quote }}
  APP_DB_PASSWORD: {{ $appPw | quote }}
  {{- end }}
  {{- with $s.smtpPassword }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with $s.platformAdminPassword }}
  PLATFORM_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with $s.demoPassword }}
  DEMO_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
