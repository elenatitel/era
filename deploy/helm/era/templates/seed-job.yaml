{{- if .Values.seed.enabled }}
{{- $secret := include "era.secretName" . -}}
# Ensures the platform admin exists (PLATFORM_ADMIN_EMAIL / _PASSWORD) and, for staging, a demo hotel.
# Runs after every install/upgrade; retries while the API pod is still migrating the database.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "era.fullname" . }}-seed
  labels:
    {{- include "era.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "era.selector" (list . "seed") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: seed
          image: {{ include "era.image" (list .Values.image.api .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/db/seed.js"]
          {{- if .Values.seed.demo }}
          # --force: the demo organization is refused in production mode unless explicitly forced (staging).
          args: ["--demo", "--force"]
          {{- end }}
          envFrom:
            - configMapRef: { name: {{ include "era.fullname" . }}-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: JWT_SECRET } }
            - name: ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: ENCRYPTION_KEY } }
            - name: PLATFORM_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: PLATFORM_ADMIN_PASSWORD, optional: true } }
            - name: DEMO_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: DEMO_PASSWORD, optional: true } }
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
