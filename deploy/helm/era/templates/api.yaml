{{- $name := printf "%s-api" (include "era.fullname" .) -}}
{{- $secret := include "era.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "era.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  # Migrations run in the init container; never two pods migrating at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "era.selector" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "era.selector" (list . "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # Applies database migrations with the owner role, then grants the app role its privileges.
        - name: migrate
          image: {{ include "era.image" (list .Values.image.api .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - >-
              {{ include "era.waitForDb" (dict "host" (include "era.dbHost" .) "port" .Values.database.port) }}
              && node dist/db/migrate.js
          env:
            - name: DATABASE_SSL
              value: {{ .Values.database.ssl | quote }}
            - name: DATABASE_MIGRATION_URL
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: DATABASE_MIGRATION_URL } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: DATABASE_URL } }
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: api
          image: {{ include "era.image" (list .Values.image.api .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 4000 }
          envFrom:
            - configMapRef: { name: {{ include "era.fullname" . }}-config }
          env:
            - name: PORT
              value: "4000"
            # The running API only ever gets the least-privileged database role.
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: JWT_SECRET } }
            - name: ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: ENCRYPTION_KEY } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: SMTP_PASSWORD, optional: true } }
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "era.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "era.selector" (list . "api") | nindent 4 }}
  ports:
    - { name: http, port: 4000, targetPort: http }
