# Default values for the era. chart. Production-leaning; see values-staging.yaml for a test setup.

# Public host name of the app (the web app and /api are served from it).
host: pms.example.com

image:
  # Built from the root Dockerfile: --target api and --target web.
  api:
    repository: ghcr.io/elenatitel/era-api
    tag: ""            # defaults to the chart's appVersion
  web:
    repository: ghcr.io/elenatitel/era-web
    tag: ""
  pullPolicy: IfNotPresent
  # e.g. [{ name: ghcr-pull }] for a private registry
  pullSecrets: []

app:
  name: era.
  logLevel: log                 # error | warn | log | debug | verbose
  bookingHoldMinutes: 30
  # Reverse-proxy hops in front of the API (ingress controller = 1; add 1 for a cloud load balancer that forwards).
  trustProxy: 1
  mail:
    host: ""                    # SMTP host; ignored when mailpit.enabled
    port: 587
    user: ""
    secure: false
    from: "era. <no-reply@example.com>"
  # Created/updated by the seed job when set (must enable 2FA at first sign-in).
  platformAdminEmail: ""

# Secrets. Either point to an existing Secret (recommended: sealed-secrets, External Secrets, SOPS)
# or let the chart create one from the values below. Never commit real values.
secrets:
  existingSecret: ""
  # Keys expected in an existing Secret:
  #   JWT_SECRET, ENCRYPTION_KEY, DATABASE_URL, DATABASE_MIGRATION_URL,
  #   SMTP_PASSWORD (optional), PLATFORM_ADMIN_PASSWORD (optional), DEMO_PASSWORD (optional)
  jwtSecret: ""                 # openssl rand -hex 32
  encryptionKey: ""             # openssl rand -base64 32  — losing it makes encrypted IDs and 2FA secrets unreadable
  smtpPassword: ""
  platformAdminPassword: ""
  demoPassword: ""

# Database. With postgres.enabled the chart runs PostgreSQL itself (staging); otherwise use a managed database.
database:
  host: ""                      # ignored when postgres.enabled
  port: 5432
  name: pms
  ssl: false                    # true for most managed databases
  # Owner role: runs migrations (DDL). Application role: least privilege, no BYPASSRLS — create it once:
  #   CREATE ROLE pms_app LOGIN PASSWORD '...' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
  #   GRANT CONNECT ON DATABASE pms TO pms_app;
  # The migrations grant it the table privileges it needs.
  ownerUser: pms_owner
  ownerPassword: ""
  appUser: pms_app
  appPassword: ""

api:
  # Keep 1: the login rate limiter is in memory (see README) until a shared store is added.
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
  extraEnv: []                  # [{ name: X, value: y }]

web:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }

# Optional seed job after install/upgrade: ensures the platform admin, and with demo: true a demo hotel.
seed:
  enabled: false
  demo: false                   # refused by the app in production unless forced (see values-staging.yaml)

ingress:
  enabled: true
  className: nginx
  annotations: {}
  tls:
    enabled: true
    # Name of the TLS Secret; with cert-manager set clusterIssuer and it is created for you.
    secretName: ""
    clusterIssuer: ""           # e.g. letsencrypt-prod
  # Staging: protect everything with a username/password (ingress-nginx only).
  # The Secret must contain an htpasswd file under the key "auth":
  #   htpasswd -c auth tester && kubectl create secret generic era-staging-auth --from-file=auth
  basicAuth:
    enabled: false
    secretName: ""

# Bundled PostgreSQL — for staging and tests only. Use a managed, backed-up database in production.
postgres:
  enabled: false
  image: postgres:17-alpine
  storage: 5Gi
  storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# Mailpit catches every e-mail the app sends and shows it in a web inbox (staging only).
mailpit:
  enabled: false
  image: axllent/mailpit:v1.20.0
  # Optional host for the inbox UI, e.g. mail.staging.example.com (protected by the same basic auth).
  host: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000               # the "node" user of the official image
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}
