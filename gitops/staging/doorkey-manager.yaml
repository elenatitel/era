apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: era-doorkey-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: era-staging
  source:
    repoURL: harbor.cloud.retreat480.com/era
    chart: era-doorkey-manager
    targetRevision: 0.1.0-ci.40.1
    helm:
      releaseName: era-doorkey-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: era-staging
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
