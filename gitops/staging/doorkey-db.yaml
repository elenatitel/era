apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: era-doorkey-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: era-staging
  source:
    repoURL: harbor.cloud.retreat480.com/era
    chart: era-doorkey-db
    targetRevision: 0.1.0-ci.40.1
    helm:
      releaseName: era-doorkey-db
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
