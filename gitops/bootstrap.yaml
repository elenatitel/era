# Applied once by a cluster admin: kubectl apply -f gitops/bootstrap.yaml
# Creates the restricted era-staging project and the root Application that watches gitops/staging.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: era-staging
  namespace: argocd
spec:
  description: era. staging charts from Harbor
  sourceRepos:
    - harbor.cloud.retreat480.com/era
  destinations:
    - server: https://kubernetes.default.svc
      namespace: era-staging
    - server: https://kubernetes.default.svc
      namespace: postgres
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: postgresql.cnpg.io
      kind: Database
    - group: postgresql.cnpg.io
      kind: DatabaseRole
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: traefik.io
      kind: Middleware
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: era-staging-root
  namespace: argocd
spec:
  project: default
  source:
    # Public repository. Staging follows the feature branch until PR #1 is merged; then switch to main.
    repoURL: https://github.com/elenatitel/era.git
    targetRevision: feature/booking-engine-phase1
    path: gitops/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
