# Production: Caddy (automatic HTTPS) -> web + api -> PostgreSQL.
# Usage: cp .env.production.example .env.production && edit, then
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pms_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD}
      POSTGRES_DB: pms
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pms_owner -d pms']
      interval: 5s
      retries: 20
    networks: [internal]

  migrate:
    build: { context: ., target: api }
    command: ['node', 'dist/db/migrate.js']
    environment: &api-env
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-era.}
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN}
      DATABASE_URL: postgres://pms_app:${APP_DB_PASSWORD}@postgres:5432/pms
      DATABASE_MIGRATION_URL: postgres://pms_owner:${OWNER_DB_PASSWORD}@postgres:5432/pms
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-era. <no-reply@localhost>}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      TRUST_PROXY: 1
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    environment:
      <<: *api-env
      DATABASE_MIGRATION_URL: ''
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    networks: [internal]

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-era.}
    restart: unless-stopped
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
