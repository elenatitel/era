{{- $name := .Release.Name -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: {app.kubernetes.io/instance: {{ $name }}}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $name }}}
      annotations:
        checksum/values: {{ .Values | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: {{ .Values.imagePullSecrets | toJson }}
      nodeSelector: {{ .Values.nodeSelector | toJson }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 3000}]
          startupProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 20
          resources: {{ .Values.resources | toJson }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/apps/web/.next/cache}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: next-cache, emptyDir: {}}
