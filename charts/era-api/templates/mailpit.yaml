{{- if .Values.mailpit.enabled }}
{{- $name := printf "%s-mailpit" .Release.Name -}}
# Staging only: catches every e-mail the API sends (confirmations, guest codes, invitations).
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mailpit}
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: ui, port: 8025, targetPort: ui}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mailpit}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mailpit}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ .Values.nodeSelector | toJson }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mailpit
          image: "{{ .Values.mailpit.image.repository }}@{{ .Values.mailpit.image.digest }}"
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: ui, containerPort: 8025}
          env:
            - {name: MP_MAX_MESSAGES, value: "2000"}
          readinessProbe:
            httpGet: {path: /livez, port: ui}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
{{- end }}
