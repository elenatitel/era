{{- range $kind, $role := .Values.roles }}
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: {{ $.Release.Name }}-{{ $kind }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  cluster:
    name: {{ $.Values.clusterName }}
  name: {{ $role.name }}
  login: true
  superuser: false
  bypassrls: false
  createdb: false
  createrole: false
  passwordSecret:
    name: {{ required "Role password secret is required" $role.existingSecret }}
  databaseRoleReclaimPolicy: retain
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .Release.Name }}
spec:
  cluster:
    name: {{ .Values.clusterName }}
  name: {{ .Values.databaseName }}
  owner: {{ .Values.roles.owner.name }}
  databaseReclaimPolicy: retain
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-passwords
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- range .Values.roles }}
      - {{ .existingSecret | quote }}
      {{- end }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-passwords
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-passwords
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clusterName }}
    namespace: {{ .Release.Namespace }}
