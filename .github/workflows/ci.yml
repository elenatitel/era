name: CI
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests + API end-to-end tests against an embedded PostgreSQL (RLS, RBAC, auth, reservations…)
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
