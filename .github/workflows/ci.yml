name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests + API end-to-end tests against an embedded PostgreSQL (RLS, RBAC, auth, reservations…)
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      # Dummy secrets: only to render the templates.
      - name: Lint and render the chart (production and staging values)
        run: |
          SECRETS="--set secrets.jwtSecret=x --set secrets.encryptionKey=x --set database.ownerPassword=x --set database.appPassword=x"
          helm lint deploy/helm/era $SECRETS --set database.host=db.example.com
          helm lint deploy/helm/era -f deploy/helm/era/values-staging.yaml $SECRETS
          helm template era deploy/helm/era $SECRETS --set database.host=db.example.com > /dev/null
          helm template era deploy/helm/era -f deploy/helm/era/values-staging.yaml $SECRETS > /dev/null

  images:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull requests only build; pushes to main also publish ghcr.io/<owner>/era-<target>:<sha> and :main.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/era-${{ matrix.target }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/era-${{ matrix.target }}:main
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
