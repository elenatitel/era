name: Build and publish images and digest-locked charts

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'charts/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/package-chart.py'
      - '.github/workflows/images.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'charts/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/package-chart.py'
      - '.github/workflows/images.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: harbor.cloud.retreat480.com
  PROJECT: era

jobs:
  images:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - name: Validate Helm chart
        run: helm lint charts/era-${{ matrix.component }}

      - name: Enable ARM64 builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute image tags
        id: tags
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          image="$REGISTRY/$PROJECT/$COMPONENT"
          {
            echo 'tags<<EOF'
            echo "$image:sha-$GITHUB_SHA"
            echo "$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
              echo "$image:staging"
            elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
              # Only Docker-compatible version tags are accepted.
              tag="${GITHUB_REF#refs/tags/}"
              [[ "$tag" =~ ^v[0-9][A-Za-z0-9_.-]{0,126}$ ]]
              echo "$image:$tag"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # One root Dockerfile builds both services; the target picks the image.
      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=era-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=era-${{ matrix.component }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=min

      - name: Summarize image
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published images'
            printf '%s\n' "$IMAGE_TAGS"
            printf '\nDigest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package and publish digest-locked chart
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          version="0.1.0-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          python3 scripts/package-chart.py "charts/era-$COMPONENT" \
            --version "$version" --app-version "$GITHUB_SHA" \
            --repository "$REGISTRY/$PROJECT/$COMPONENT" --digest "$IMAGE_DIGEST"
          export HELM_REGISTRY_CONFIG="$RUNNER_TEMP/helm-registry.json"
          trap 'rm -f "$HELM_REGISTRY_CONFIG"' EXIT
          printf '%s' "$HARBOR_PASSWORD" | helm registry login "$REGISTRY" \
            --username "$HARBOR_USERNAME" --password-stdin
          helm push "dist/charts/era-$COMPONENT-$version.tgz" "oci://$REGISTRY/$PROJECT"
          printf '\nChart: `era-%s` version `%s` locks `%s`\n' \
            "$COMPONENT" "$version" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  database-chart:
    name: Publish pinned database chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Validate database chart
        run: helm lint charts/era-db
      - name: Package and publish database chart
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          version="0.1.0-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          python3 scripts/package-chart.py charts/era-db \
            --version "$version" --app-version "$GITHUB_SHA"
          export HELM_REGISTRY_CONFIG="$RUNNER_TEMP/helm-registry.json"
          trap 'rm -f "$HELM_REGISTRY_CONFIG"' EXIT
          printf '%s' "$HARBOR_PASSWORD" | helm registry login "$REGISTRY" \
            --username "$HARBOR_USERNAME" --password-stdin
          helm push "dist/charts/era-db-$version.tgz" "oci://$REGISTRY/$PROJECT"
          printf '\nChart: `era-db` version `%s` (PostgreSQL digest pinned in Git)\n' \
            "$version" >> "$GITHUB_STEP_SUMMARY"
